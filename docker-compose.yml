# Production-like stack: Caddy (TLS, static client, reverse proxy) + Bun game server.
# Usage: DOMAIN=gra.example.pl docker compose up -d --build   (see docs/deploy.md)
services:
  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_PATH: /data/redakcja.sqlite
    volumes:
      - db:/data
    expose:
      - '3000'

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db:
  caddy-data:
  caddy-config:
