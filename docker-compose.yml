
services:
  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_PATH: /data/redakcja.sqlite
    volumes:
      - db:/data
    expose:
      - "3000"

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      # Only the host's local reverse proxy can access this port.
      - "0.0.0.0:8080:80"

volumes:
  db:
