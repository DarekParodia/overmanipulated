# Production-like stack: Caddy (TLS, static client, reverse proxy) + Bun game server.
# Usage: DOMAIN=gra.example.pl docker compose up -d --build   (see docs/deploy.md)
# Sized for a small VPS (1 vCPU / 1 GB RAM): a 4-player room is a few MB, the limits only cap
# runaway behaviour.

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    init: true
    # The server stops accepting sockets and closes the database on SIGTERM; 15 s is plenty.
    stop_grace_period: 15s
    environment:
      PORT: 3000
      DATABASE_PATH: /data/redakcja.sqlite
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - db:/data
    expose:
      - '3000'
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    depends_on:
      server:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging: *logging

volumes:
  db:
  caddy-data:
  caddy-config:
