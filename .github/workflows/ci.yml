name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run validate:content
      - name: Check that DB migrations are up to date with the schema
        run: |
          bun run db:generate
          test -z "$(git status --porcelain apps/server/drizzle)" || (echo "Run bun run db:generate and commit the migration" && git status --porcelain apps/server/drizzle && exit 1)
      - run: bun run build
