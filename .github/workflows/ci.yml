name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run lint:design
      - run: bun run typecheck
      - run: bun run test
      - run: bun run validate:content
      - name: Check that DB migrations are up to date with the schema
        run: |
          bun run db:generate
          test -z "$(git status --porcelain apps/server/drizzle)" || (echo "Run bun run db:generate and commit the migration" && git status --porcelain apps/server/drizzle && exit 1)
      - run: bun run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          push: false
          tags: redakcja-server:ci
      - name: Build web (Caddy) image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          tags: redakcja-web:ci
